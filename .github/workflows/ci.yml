name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: scripts/catalog-requirements.txt
      - run: python -m pip install -r scripts/catalog-requirements.txt
      - run: python scripts/generate_catalog.py --check
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/lazypkg
      - run: go run ./cmd/lazypkg --help
      - if: runner.os != 'Windows'
        run: python3 scripts/pty_smoke.py
