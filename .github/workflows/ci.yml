name: CI
on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: scripts/catalog-requirements.txt
      - run: python -m pip install -r scripts/catalog-requirements.txt
      - run: python scripts/generate_catalog.py --check
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/lazypkg
      - run: go run ./cmd/lazypkg --help
      - if: runner.os != 'Windows'
        run: python3 scripts/pty_smoke.py

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publisher and independent source/module boundary tests
        run: python3 -m unittest discover -s scripts -p 'test_*release*.py'
      - run: python3 -m unittest discover -s scripts -p test_distribution.py
      - run: python3 scripts/check-distribution.py
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --snapshot --clean --skip=publish,announce
      - name: Verify complete snapshot archives and native executable
        run: python3 scripts/release.py check --project lazypkg --binary lazypkg --smoke
